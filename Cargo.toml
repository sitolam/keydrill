[package]
name = "keydrill"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
description = "A terminal trainer for keyboard shortcuts: it makes you press them"
repository = "https://github.com/sitolam/keydrill"
license = "GPL-3.0-or-later"
readme = "README.md"
keywords = ["tui", "keyboard", "shortcuts", "spaced-repetition", "niri"]
categories = ["command-line-utilities"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
rand = "0.8"
ratatui = "0.29"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

[profile.release]
lto = true
strip = true
